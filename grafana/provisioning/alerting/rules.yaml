  rules:
  - uid: red-limit
    title: Red-limit violation
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 30
        to: 0
      datasourceUid: influxdb
      model:
        refId: A
        query: |-
          import "dict"
          low = ["T_array_K": 150.0, "T_structure_K": 240.0, "T_battery_K": 268.15, "T_avionics_K": 243.15, "T_radiator_K": 200.0]
          high = ["T_array_K": 400.0, "T_structure_K": 330.0, "T_battery_K": 318.15, "T_avionics_K": 343.15, "T_radiator_K": 330.0]
          from(bucket: v.defaultBucket)
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => r._measurement == "housekeeping" and r.source == "fsw")
            |> filter(fn: (r) => r._field =~ /^T_/)
            |> map(fn: (r) => ({r with _value:
                if r._value < dict.get(dict: low, key: r._field, default: -1000000.0)
                  or r._value > dict.get(dict: high, key: r._field, default: 1000000.0) then 1.0 else 0.0}))
            |> max()
            |> map(fn: (r) => ({r with node: r._field}))
            |> group(columns: ["node"])
            |> keep(columns: ["_time", "_value", "node"])
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: max
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      summary: '{{ $labels.node }} crossed its red limit (docs/limits.md)'
    labels:
      severity: critical
